<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Pro Aggregator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-900">
    <!-- Sidebar -->
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fas fa-rss-square mr-3 text-blue-500"></i>
                    RSS Pro
                </h1>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center p-3 rounded-lg bg-blue-600 text-white transition-all">
                    <i class="fas fa-home mr-3"></i> Все статьи
                </a>
                <a href="#" class="flex items-center p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-all">
                    <i class="fas fa-shield-alt mr-3"></i> InfoSec
                </a>
                <a href="#" class="flex items-center p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-all">
                    <i class="fas fa-code mr-3"></i> IT News
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center p-2 text-slate-400 text-sm">
                    <i class="fas fa-circle text-green-500 mr-2 text-[8px]"></i> System Online
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Header -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 flex-shrink-0">
                <div class="flex items-center space-x-4">
                    <h2 class="text-lg font-semibold text-slate-800">Лента новостей</h2>
                    <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-medium" id="articleCount">0 статей</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-slate-500 hover:text-slate-800 transition-colors">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <div class="h-8 w-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600">
                        <i class="fas fa-user text-sm"></i>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto p-8" id="articleGrid">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Loading state -->
                    <div class="animate-pulse bg-white rounded-xl h-64 border border-slate-200"></div>
                    <div class="animate-pulse bg-white rounded-xl h-64 border border-slate-200"></div>
                    <div class="animate-pulse bg-white rounded-xl h-64 border border-slate-200"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchArticles() {
            try {
                const response = await fetch('/api/articles?limit=20');
                const articles = await response.json();
                renderArticles(articles);
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('articleGrid').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400">
                        <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                        <p>Ошибка при загрузке данных. Проверьте соединение.</p>
                    </div>
                `;
            }
        }

        function renderArticles(articles) {
            const grid = document.getElementById('articleGrid');
            const count = document.getElementById('articleCount');
            count.innerText = `${articles.length} статей`;

            if (articles.length === 0) {
                grid.innerHTML = '<div class="text-center text-slate-500 py-20">Пока ничего нет. Бот собирает данные...</div>';
                return;
            }

            grid.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${articles.map(a => `
                        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow group flex flex-col h-full">
                            ${a.image_url ? `
                                <div class="h-48 overflow-hidden bg-slate-100">
                                    <img src="${a.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.style.display='none'">
                                </div>
                            ` : ''}
                            <div class="p-5 flex flex-col flex-1">
                                <div class="flex items-center text-xs text-blue-600 font-bold mb-2 uppercase tracking-wider">
                                    <i class="fas fa-tag mr-1"></i> Hub
                                </div>
                                <h3 class="text-base font-bold text-slate-900 mb-2 line-clamp-2 hover:text-blue-600 transition-colors">
                                    <a href="${a.link}" target="_blank">${a.title}</a>
                                </h3>
                                <p class="text-slate-600 text-sm mb-4 line-clamp-3">
                                    ${a.summary}
                                </p>
                                <div class="mt-auto flex items-center justify-between pt-4 border-t border-slate-50">
                                    <span class="text-slate-400 text-xs">
                                        <i class="far fa-clock mr-1"></i> ${new Date(a.pub_date).toLocaleDateString()}
                                    </span>
                                    <a href="${a.link}" target="_blank" class="text-blue-600 text-sm font-semibold hover:underline">
                                        Читать <i class="fas fa-arrow-right ml-1 text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Initialize
        fetchArticles();
        // Refresh every minute
        setInterval(fetchArticles, 60000);
    </script>
</body>
</html>
